rcel.app. Include the relevant URL, your name, and the reason for contacting us."],["Corrections","Send the article URL, the specific error, and reliable evidence. We review correction requests and update the article with a visible note when appropriate."],["Advertising","Advertising requests do not guarantee publication, editorial coverage, or a positive review. All advertising must comply with applicable law and platform policy."]]},"/privacy-policy":{title:"गोपनीयता नीति / Privacy Policy",intro:"This policy explains how NewsArc handles information when you visit the website, contact us, subscribe, or interact with advertising.",sections:[["Information we receive","We may receive information you voluntarily submit, such as your name and email address when contacting us or subscribing. We may also receive technical information such as browser type, approximate location, device information, and pages viewed."],["Cookies and analytics","We may use necessary storage and privacy-respecting analytics to operate and improve the site. Advertising cookies or similar technologies will be used only as permitted by applicable law and the consent choices available in your region."],["Advertising and third parties","If approved, Google AdSense or another advertising provider may process information to deliver and measure ads. Their processing is governed by their own privacy policies. Do not submit sensitive personal information through public forms."],["Retention and security","We retain information only as long as reasonably necessary for the stated purpose, legal obligations, dispute resolution, and security. No online service can guarantee absolute security."],["Your rights and contact","You may request access, correction, or deletion of information we hold where applicable. Contact hello@newsarc-ga3f.vercel.app with the subject “Privacy request”."]]},"/terms":{title:"नियम तथा सर्त / Terms of Use",intro:"By using NewsArc, you agree to use the site lawfully and respect the r
