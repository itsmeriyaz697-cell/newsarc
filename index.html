    <div id="root"></div>
  
<script>
(()=>{const key='newsarc-rss-refresh-v1',day=new Date().toISOString().slice(0,10),feeds=[
'https://news.google.com/rss/search?q=Nepal&hl=ne&gl=NP&ceid=NP:ne',
'https://news.google.com/rss/search?q=Nepal%20technology&hl=en&gl=US&ceid=US:en'
];
function mount(items){if(document.getElementById('newsarc-rss'))return;const box=document.createElement('section');box.id='newsarc-rss';box.setAttribute('aria-labelledby','newsarc-rss-title');box.innerHTML='<h2 id="newsarc-rss-title">ताजा स्रोतहरू</h2><p class="newsarc-rss-status">विश्वसनीय सार्वजनिक RSS स्रोतबाट दैनिक अपडेट</p><ul></ul>';const list=box.querySelector('ul');items.slice(0,8).forEach(x=>{const li=document.createElement('li');const a=document.createElement('a');a.href=x.link;a.target='_blank';a.rel='noopener noreferrer';a.textContent=x.title;const s=document.createElement('small');s.textContent=x.pubDate?new Date(x.pubDate).toLocaleDateString('ne-NP'):'';li.append(a,s);list.append(li)});(document.querySelector('main')||document.body).append(box)}
async function load(){try{const cached=JSON.parse(localStorage.getItem(key)||'null');if(cached&&cached.day===day){mount(cached.items);return}const all=[];for(const url of feeds){const r=await fetch('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(url));const j=await r.json();if(j.items)all.push(...j.items)}const unique=[...new Map(all.map(x=>[x.link,x])).values()].sort((a,b)=>new Date(b.pubDate)-new Date(a.pubDate));localStorage.setItem(key,JSON.stringify({day,items:unique.slice(0,12)}));mount(unique)}catch(e){console.warn('NewsArc RSS unavailable',e)}}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',load);else load()})();
</script>
